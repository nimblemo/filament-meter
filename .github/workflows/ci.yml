name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Resolve & sync dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q

      - name: Build sdist + wheel
        run: uv build

      - name: Smoke test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/filament_meter-*.whl | head -n1)
          echo "Wheel: $wheel"
          uv tool run --from "$wheel" filament-meter --help >/dev/null
          uv tool run --from "$wheel" filament-meter --version

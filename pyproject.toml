[project]
name = "filament-meter"
version = "0.1.0"
description = "Measure 3D-print filament usage from .3mf / .gcode files, with automatic OrcaSlicer provisioning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nimblemo" }]
keywords = ["3d-printing", "filament", "orcaslicer", "bambu", "slicer", "3mf", "gcode", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "platformdirs>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/nimblemo/filament-meter"
Repository = "https://github.com/nimblemo/filament-meter"
Issues = "https://github.com/nimblemo/filament-meter/issues"
Changelog = "https://github.com/nimblemo/filament-meter/blob/main/CHANGELOG.md"

[project.scripts]
filament-meter = "filament_meter.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filament_meter"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["filament_meter"]
branch = true
